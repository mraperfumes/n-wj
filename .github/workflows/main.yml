
name: Delete All Except SEO Files

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to confirm"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm deletion
        if: ${{ inputs.confirm != 'DELETE' }}
        run: exit 1

      - name: Delete everything except protected files
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'CNAME' \
            ! -name 'sitemap.xml' \
            ! -name 'robots.txt' \
            -exec rm -rf {} +

      - name: Commit and push
        run: |
          git add -A
          git commit -m "Clean repository except SEO files" || echo "Nothing to commit"
          git push
