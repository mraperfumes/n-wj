
name: Delete All Except SEO Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete files
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'CNAME' \
            ! -name 'sitemap.xml' \
            ! -name 'robots.txt' \
            -exec rm -rf {} +

      - name: Commit and push
        run: |
          git add -A
          git commit -m "Clean repository"
          git push
